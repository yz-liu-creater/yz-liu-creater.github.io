<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script>
    try {
      const theme = localStorage.getItem("yuzhe-site-theme");
      document.documentElement.dataset.theme = theme === "dark" ? "dark" : "light";
    } catch (error) {
      document.documentElement.dataset.theme = "light";
    }
  </script>
  <meta name="description" content="刘宇哲 / Yuzhe Liu 的友链页面" />
  <title>Contact | 刘宇哲</title>
  <link rel="stylesheet" href="style.css?v=20260731i" />
  <script src="script.js?v=20260731f" defer></script>
</head>
<body
  data-page="contact"
  data-title-en="Contact | Yuzhe Liu"
  data-title-zh="友链 | 刘宇哲"
  data-description-en="Friend links page of Yuzhe Liu."
  data-description-zh="刘宇哲 / Yuzhe Liu 的友链页面"
>
  <main class="site-shell page-shell">
    <div class="hero-bg" aria-hidden="true"></div>
    <div class="hero-vignette" aria-hidden="true"></div>
    <div class="light-grid" aria-hidden="true"></div>

    <header class="navbar">
      <a class="brand" href="index.html">Yuzhe Liu</a>
      <div class="nav-cluster">
        <nav class="nav-links" aria-label="Primary navigation">
          <a href="index.html" data-nav="about" data-i18n="nav.about">About</a>
          <a href="researchs.html" data-nav="researchs" data-i18n="nav.researchs">Researchs</a>
          <a href="projects.html" data-nav="projects" data-i18n="nav.projects">Projects</a>
          <a href="blogs.html" data-nav="blogs" data-i18n="nav.blogs">Blogs</a>
          <a href="contact.html" data-nav="contact" data-i18n="nav.contact">Contact</a>
        </nav>
        <button class="theme-toggle" type="button" data-theme-toggle aria-label="Switch to dark theme" title="Switch to dark theme">
          <span class="theme-icon" aria-hidden="true">☾</span>
        </button>
        <div class="lang-switch" role="group" aria-label="Language">
          <button class="lang-option" type="button" data-lang="en">EN</button>
          <button class="lang-option" type="button" data-lang="zh">中</button>
        </div>
      </div>
    </header>

    <section class="page-main" aria-labelledby="contact-title">
      <div class="page-heading">
        <h1 id="contact-title" data-i18n="page.contact.title">Contact</h1>
        <p class="page-subtitle" data-i18n="page.contact.subtitle">
          A quiet page for public friend links, personal sites, and blogs.
        </p>
      </div>

      <article class="empty-panel">
        <span class="empty-index">04</span>
        <div>
          <h2 data-i18n="empty.title">No public entries yet</h2>
          <p data-i18n="empty.contact.copy">
            Friend links will appear here when the list is ready.
          </p>
        </div>
      </article>
    </section>
  </main>
</body>
</html>
